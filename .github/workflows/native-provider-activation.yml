name: Pinned native activation harness

on:
  pull_request:
    paths:
      - .github/workflows/native-provider-activation.yml
      - tests/native-provider-activation-ci/**
      - tests/native-provider-activation-workflow.test.mjs
      - tests/workflow-routing.test.mjs
      - scripts/run-native-cli-smoke.py
      - tests/native-cli-smoke/**
      - tests/native-provider-qualification/**
      - apps/zryna/src/**
      - apps/zryna/Cargo.toml
      - crates/**
      - Cargo.toml
      - Cargo.lock
      - rust-toolchain.toml
  workflow_dispatch:

concurrency:
  group: native-activation-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

# Preparation proof for this immutable consumer, not coverage of future source revisions.
env:
  ACTIVATION_CONSUMER_SHA: 6c0f3f64a1278a53a61e2d732ef5e43246ab826f

jobs:
  smoke:
    name: pinned native activation (${{ matrix.os }})
    timeout-minutes: ${{ matrix.os == 'windows-latest' && 60 || 40 }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout exact CI tooling
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          path: coverage
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Checkout pinned activation consumer
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          path: consumer
          ref: ${{ env.ACTIVATION_CONSUMER_SHA }}
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c
        with:
          toolchain: 1.97.1
          components: rustfmt, clippy
      - name: Verify exact checkouts and Python requirement
        shell: pwsh
        env:
          COVERAGE_HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          python -c "import sys; assert sys.version_info >= (3, 11); print(sys.version)"
          if ($LASTEXITCODE -ne 0) { throw 'Python requirement failed' }
          foreach ($checkoutPath in @('coverage', 'consumer')) {
            $expected = if ($checkoutPath -eq 'coverage') { $env:COVERAGE_HEAD } else { $env:ACTIVATION_CONSUMER_SHA }
            $actual = git -C $checkoutPath rev-parse HEAD
            if ($LASTEXITCODE -ne 0 -or $actual -ne $expected) { throw 'Exact checkout differs' }
            $status = git -C $checkoutPath status --porcelain
            if ($LASTEXITCODE -ne 0 -or $status) { throw 'Checkout is not clean' }
          }
      - name: Verify independent CI receipt controls
        run: python coverage/tests/native-provider-activation-ci/verify_receipts_test.py
      - name: Fetch locked consumer dependencies
        working-directory: consumer
        run: cargo fetch --locked
      - name: Verify consumer runner controls
        working-directory: consumer
        run: python tests/native-provider-activation/runner_test.py
      - name: Run relocated native frontend smoke
        working-directory: consumer
        shell: pwsh
        run: python scripts/run-native-provider-activation.py --evidence-dir "$env:RUNNER_TEMP/activation-frontend" --target-dir "$env:RUNNER_TEMP/activation-target"
      - name: Require exact frontend receipt
        shell: pwsh
        run: python coverage/tests/native-provider-activation-ci/verify_receipts.py --consumer consumer --evidence-dir "$env:RUNNER_TEMP/activation-frontend" --target-dir "$env:RUNNER_TEMP/activation-target"
      - name: Run relocated retained-source smoke
        working-directory: consumer
        shell: pwsh
        run: python scripts/run-native-provider-activation.py --retained --evidence-dir "$env:RUNNER_TEMP/activation-retained" --target-dir "$env:RUNNER_TEMP/activation-target"
      - name: Require exact retained receipt
        shell: pwsh
        run: python coverage/tests/native-provider-activation-ci/verify_receipts.py --retained --consumer consumer --evidence-dir "$env:RUNNER_TEMP/activation-retained" --target-dir "$env:RUNNER_TEMP/activation-target"
      - name: Preserve exact consumer receipts and logs
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: native-activation-${{ matrix.os }}-${{ env.ACTIVATION_CONSUMER_SHA }}
          path: |
            ${{ runner.temp }}/activation-frontend
            ${{ runner.temp }}/activation-retained
          if-no-files-found: error
          retention-days: 7

  private-cli:
    name: private native CLI (${{ matrix.os }})
    timeout-minutes: ${{ matrix.os == 'windows-latest' && 60 || 40 }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    env:
      CLI_SOURCE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
    steps:
      - name: Checkout exact current CLI source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          ref: ${{ env.CLI_SOURCE_SHA }}
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c
        with:
          toolchain: 1.97.1
          components: clippy
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22.22.1
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
        with:
          version: 11.18.0
      - run: pnpm install --frozen-lockfile
      - name: Fetch locked current CLI dependencies
        run: cargo fetch --locked
      - name: Verify independent CLI receipt hostile cases
        run: python -B tests/native-cli-smoke/verify_ci_receipts_test.py
      - name: Build both current CLIs and run exact private smoke
        shell: pwsh
        run: |
          $cargo = rustup which cargo
          if ($LASTEXITCODE -ne 0) { throw 'Cargo resolution failed' }
          $rustc = rustup which rustc
          if ($LASTEXITCODE -ne 0) { throw 'Rustc resolution failed' }
          $node = (Get-Command node).Source
          python -B tests/native-cli-smoke/run_ci.py --root "$env:GITHUB_WORKSPACE" --head "$env:CLI_SOURCE_SHA" --target "$env:RUNNER_TEMP/private-cli-target" --output "$env:RUNNER_TEMP/private-cli-proof" --node "$node" --cargo "$cargo" --rustc "$rustc"
          if ($LASTEXITCODE -ne 0) { throw 'Private CLI proof failed' }
      - name: Require independently verified current CLI receipt
        shell: pwsh
        run: |
          $platform = if ($IsWindows) { 'win32' } else { 'linux' }
          python -B tests/native-cli-smoke/verify_ci_receipts.py --root "$env:GITHUB_WORKSPACE" --head "$env:CLI_SOURCE_SHA" --platform "$platform" --output "$env:RUNNER_TEMP/private-cli-proof"
          if ($LASTEXITCODE -ne 0) { throw 'Current CLI receipt admission failed' }
      - name: Verify independent seven-source manifest controls
        run: python -B tests/native-provider-qualification/production-manifests/verify_test.py
      - name: Run seven accepted production manifest pairs
        shell: pwsh
        run: |
          python -B tests/native-provider-qualification/production-manifests/run.py --root "$env:GITHUB_WORKSPACE" --head "$env:CLI_SOURCE_SHA" --cli-proof "$env:RUNNER_TEMP/private-cli-proof" --output "$env:RUNNER_TEMP/private-production-manifests"
          if ($LASTEXITCODE -ne 0) { throw 'Production manifest pairs failed' }
      - name: Require independent seven-source manifest admission
        shell: pwsh
        run: |
          $platform = if ($IsWindows) { 'win32' } else { 'linux' }
          python -B tests/native-provider-qualification/production-manifests/verify.py --root "$env:GITHUB_WORKSPACE" --head "$env:CLI_SOURCE_SHA" --platform "$platform" --output "$env:RUNNER_TEMP/private-production-manifests" --live
          if ($LASTEXITCODE -ne 0) { throw 'Production manifest admission failed' }
      - name: Preserve seven accepted production manifest pairs
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: private-production-manifests-${{ matrix.os }}-${{ env.CLI_SOURCE_SHA }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/private-production-manifests
          if-no-files-found: error
          retention-days: 7
      - name: Check private feature Clippy on current host
        env:
          CARGO_TARGET_DIR: ${{ runner.temp }}/private-cli-target
          CARGO_PROFILE_DEV_DEBUG: '0'
          CARGO_PROFILE_TEST_DEBUG: '0'
          CARGO_BUILD_JOBS: '2'
        run: cargo clippy --locked --offline -p zryna-driver --all-targets --features native-provider-internal -- -D warnings
      - name: Verify cold qualification hostile receipt controls
        run: python -B tests/native-provider-qualification/verify_test.py
      - name: Run current cold BUILD and retained Vec fault execution
        shell: pwsh
        run: |
          python -B tests/native-provider-qualification/run.py --root "$env:GITHUB_WORKSPACE" --head "$env:CLI_SOURCE_SHA" --cli-proof "$env:RUNNER_TEMP/private-cli-proof" --target "$env:RUNNER_TEMP/private-cli-target" --output "$env:RUNNER_TEMP/private-cold-proof" --cold-root "$env:RUNNER_TEMP/private-cold-source"
          if ($LASTEXITCODE -ne 0) { throw 'Cold retained qualification failed' }
      - name: Require independent cold BUILD and frozen fault receipts
        shell: pwsh
        run: |
          $platform = if ($IsWindows) { 'win32' } else { 'linux' }
          python -B tests/native-provider-qualification/verify.py --root "$env:GITHUB_WORKSPACE" --head "$env:CLI_SOURCE_SHA" --platform "$platform" --output "$env:RUNNER_TEMP/private-cold-proof"
          if ($LASTEXITCODE -ne 0) { throw 'Cold retained receipt admission failed' }
      - name: Verify independent finite fault corpus controls
        run: python -B tests/native-provider-qualification/corpus/verify_test.py
      - name: Run remaining frozen M3 fault groups
        shell: pwsh
        run: |
          $cargo = rustup which cargo
          if ($LASTEXITCODE -ne 0) { throw 'Cargo resolution failed' }
          $rustc = rustup which rustc
          if ($LASTEXITCODE -ne 0) { throw 'Rustc resolution failed' }
          $node = (Get-Command node).Source
          python -B tests/native-provider-qualification/corpus/run.py --root "$env:GITHUB_WORKSPACE" --head "$env:CLI_SOURCE_SHA" --target "$env:RUNNER_TEMP/private-cli-target" --output "$env:RUNNER_TEMP/private-fault-corpus-proof" --cargo "$cargo" --rustc "$rustc" --node "$node"
          if ($LASTEXITCODE -ne 0) { throw 'Finite retained fault corpus failed' }
      - name: Require independent remaining frozen fault observations
        shell: pwsh
        run: |
          $platform = if ($IsWindows) { 'win32' } else { 'linux' }
          python -B tests/native-provider-qualification/corpus/verify.py --root "$env:GITHUB_WORKSPACE" --head "$env:CLI_SOURCE_SHA" --platform "$platform" --output "$env:RUNNER_TEMP/private-fault-corpus-proof"
          if ($LASTEXITCODE -ne 0) { throw 'Finite retained fault corpus admission failed' }
      - name: Verify independent physical allocation controls
        if: matrix.os == 'ubuntu-latest'
        run: python -B tests/native-provider-qualification/physical/handles_verify_test.py
      - name: Run handles real physical allocation group
        if: matrix.os == 'ubuntu-latest'
        shell: pwsh
        run: |
          $cargo = rustup which cargo
          if ($LASTEXITCODE -ne 0) { throw 'Cargo resolution failed' }
          $rustc = rustup which rustc
          if ($LASTEXITCODE -ne 0) { throw 'Rustc resolution failed' }
          $node = (Get-Command node).Source
          python -B tests/native-provider-qualification/physical/run.py --group handles --root "$env:GITHUB_WORKSPACE" --head "$env:CLI_SOURCE_SHA" --target "$env:RUNNER_TEMP/private-cli-target" --output "$env:RUNNER_TEMP/private-physical-proof" --cargo "$cargo" --rustc "$rustc" --node "$node"
          if ($LASTEXITCODE -ne 0) { throw 'Real physical allocation corpus failed' }
      - name: Require independent real physical allocation observations
        if: matrix.os == 'ubuntu-latest'
        shell: pwsh
        run: |
          python -B tests/native-provider-qualification/physical/verify.py --group handles --root "$env:GITHUB_WORKSPACE" --head "$env:CLI_SOURCE_SHA" --platform linux --output "$env:RUNNER_TEMP/private-physical-proof"
          if ($LASTEXITCODE -ne 0) { throw 'Real physical allocation admission failed' }
      - name: Preserve exact real physical allocation proof
        if: always() && matrix.os == 'ubuntu-latest'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: private-native-physical-handles-${{ matrix.os }}-${{ env.CLI_SOURCE_SHA }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/private-physical-proof
          if-no-files-found: error
          retention-days: 7
      - name: Preserve exact current CLI proof
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: private-native-cli-${{ matrix.os }}-${{ env.CLI_SOURCE_SHA }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/private-cli-proof/*.json
            ${{ runner.temp }}/private-cli-proof/*.stdout
            ${{ runner.temp }}/private-cli-proof/*.stderr
            ${{ runner.temp }}/private-cli-proof/smoke
          if-no-files-found: error
          retention-days: 7
      - name: Preserve exact cold BUILD and retained Vec proof
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: private-native-cold-${{ matrix.os }}-${{ env.CLI_SOURCE_SHA }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/private-cold-proof
          if-no-files-found: error
          retention-days: 7
      - name: Preserve exact remaining frozen fault corpus
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: private-native-fault-corpus-${{ matrix.os }}-${{ env.CLI_SOURCE_SHA }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/private-fault-corpus-proof
          if-no-files-found: error
          retention-days: 7
      - name: Preserve current CLI executables
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: private-native-cli-binaries-${{ matrix.os }}-${{ env.CLI_SOURCE_SHA }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/private-cli-proof/default-cli*
            ${{ runner.temp }}/private-cli-proof/feature-cli*
          if-no-files-found: error
          retention-days: 7
